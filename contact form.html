<html>
<head>
  <title>Contact Form</title>
  <style>
    body {
      font-family: Verdana, Arial, sans-serif;
      font-size: 13px;
      background: #f5f5f5;
      padding: 20px;
    }
    form { width: 420px; }
    label {
      display: block;
      font-weight: bold;
      color: #333;
      margin-top: 14px;
      margin-bottom: 3px;
    }
    input[type="text"],
    input[type="email"] {
      width: 240px;
      height: 20px;
      border: 1px solid #b44;
      padding: 2px;
    }
    textarea {
      width: 330px;
      height: 170px;
      border: 1px solid #b44;
      padding: 2px;
    }
    .copy { margin-top: 14px; }
    .copy label {
      display: inline;
      font-weight: normal;
    }
    button {
      margin-top: 14px;
      background: #2e8b2e;
      color: #fff;
      font-weight: bold;
      border: none;
      padding: 4px 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <form action="#" method="post">
    <label for="name">Enter your Name:</label>
    <input type="text" id="name" name="name">

    <label for="email">E-mail address*:</label>
    <input type="email" id="email" name="email" required>

    <label for="subject">Message Subject:</label>
    <input type="text" id="subject" name="subject">

    <label for="message">Enter your Message*:</label>
    <textarea id="message" name="message" required></textarea>

    <div class="copy">
      <input type="checkbox" id="copy" name="copy">
      <label for="copy">E-mail a copy of this message to your own address.</label>
    </div>

    <button type="submit">Send</button>
  </form>

</body>
</html>
